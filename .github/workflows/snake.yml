name: Update contribution animation

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e40af
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161b22,#172554,#1e40af,#3b82f6,#93c5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated SVGs to profile-assets branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: profile-assets
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: "Update contribution animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
